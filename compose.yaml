# Postgres local do desenvolvimento. O Spring Boot sobe este serviço sozinho no perfil dev
# (spring-boot-docker-compose). Os valores vêm do arquivo .env (veja o .env.example).
services:
  banco:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaolivre}
      POSTGRES_USER: ${POSTGRES_USER:-vaolivre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados-banco:/var/lib/postgresql

volumes:
  dados-banco:
