spring.application.name=vao-livre

# Segredos locais ficam no .env (fora do Git); em produção, nas variáveis de ambiente.
spring.config.import=optional:file:.env[.properties]

# Telas, CSS e JS de cada parte ficam juntos em resources/partes/<parte>/.
spring.thymeleaf.prefix=classpath:/partes/
spring.thymeleaf.suffix=.html
app.partes=classpath:/partes/
# O mapeamento padrão de estáticos fica desligado: só .css, .js e .svg são servidos (GlobalConfig).
spring.web.resources.add-mappings=false

spring.messages.basename=partes/global/conteudo,partes/acesso/conteudo,partes/portaria/conteudo,\
  partes/painel/conteudo,partes/clientes/conteudo,partes/contratos/conteudo,\
  partes/veiculos/conteudo,partes/historico/conteudo,partes/equipe/conteudo,\
  partes/auditoria/conteudo,partes/conta/conteudo,partes/ajuda/conteudo,\
  partes/privacidade/conteudo,partes/error/conteudo
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Banco: tabelas só pelo Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

# Sessão
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h

# Erros sem detalhes internos
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never

# Primeiro acesso (lidos do .env ou do ambiente)
app.admin.nome=${APP_ADMIN_NOME:Administrador}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.senha=${APP_ADMIN_SENHA:}
app.senha-area=${APP_SENHA_AREA:}
app.modo-revisao=${MODO_REVISAO:false}
app.fuso=America/Sao_Paulo
