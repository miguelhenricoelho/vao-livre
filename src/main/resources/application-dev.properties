server.port=5173

# Mudou HTML ou CSS? Basta recarregar a página: no dev, telas, CSS e JS são lidos direto de src/.
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/partes/
app.partes=file:src/main/resources/partes/
spring.devtools.restart.enabled=true

# O Postgres do compose.yaml sobe junto com a aplicação e continua de pé depois.
spring.docker.compose.lifecycle-management=start-only

# Dados de exemplo (só neste perfil)
app.exemplo.operador-senha=${APP_OPERADOR_EXEMPLO_SENHA:}
