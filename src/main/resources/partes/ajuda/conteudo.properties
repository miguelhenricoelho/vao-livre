ajuda.titulo=Ajuda da portaria
ajuda.apoio=O que cada resultado significa e o que dizer ao motorista.
ajuda.liberado.titulo=Entrada liberada
ajuda.liberado.texto=O cliente tinha vaga livre. O veículo entra e ocupa uma vaga do contrato até a saída ser registrada. Registre a saída sempre que o carro sair, para a vaga voltar a ficar livre.
ajuda.vagas.titulo=Vagas em uso
ajuda.vagas.texto=Todas as vagas contratadas pelo cliente estão ocupadas. Diga ao motorista que a entrada libera quando um dos veículos listados sair. Se precisar, use o botão Avisar o cliente pelo WhatsApp.
ajuda.contrato.titulo=Contrato vencido ou suspenso
ajuda.contrato.texto=Nenhum veículo do cliente entra até a administração regularizar o contrato. O motorista pode falar com a administração do estacionamento.
ajuda.nao-cadastrada.titulo=Placa não cadastrada
ajuda.nao-cadastrada.texto=Confira as letras e os números com o documento do veículo. Se a placa estiver certa, só o administrador pode cadastrar o veículo.
ajuda.ja-no-patio.titulo=Já está no pátio
ajuda.ja-no-patio.texto=O sistema mostra este veículo dentro do pátio. Provavelmente a saída não foi registrada. Registre a saída e depois a entrada de novo.
ajuda.suporte=Precisa de ajuda agora?
ajuda.suporte.apoio=O suporte responde pelo WhatsApp. A mensagem já vai escrita com o seu nome e a tela em que você está.
ajuda.suporte.botao=Pedir ajuda ao suporte
ajuda.suporte.sem-numero=O WhatsApp do suporte ainda não foi cadastrado. Peça ao administrador para cadastrar na tela Equipe.

whatsapp.pedido-de-ajuda=Olá. Sou {0}, da portaria do Vão Livre. Preciso de ajuda na tela {1}. (pelo sistema)
