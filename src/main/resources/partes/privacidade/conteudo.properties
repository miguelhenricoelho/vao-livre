privacidade.titulo=Privacidade
privacidade.apoio=O que o sistema guarda, para que, quem vê e por quanto tempo (Lei 13.709/2018, LGPD).
privacidade.guarda.titulo=O que guardamos
privacidade.guarda.texto=Dos clientes: nome ou razão social, CPF ou CNPJ, responsável, WhatsApp e e-mail. Dos veículos: placa, modelo e cor. Da portaria: cada entrada, saída e bloqueio, com data, hora e quem registrou. Da equipe: nome, e-mail, papel e a senha, guardada só como resumo criptográfico.
privacidade.para-que.titulo=Para que
privacidade.para-que.texto=Para cumprir o contrato de vagas: saber quais veículos pertencem a cada cliente, liberar ou bloquear a entrada e avisar o cliente quando as vagas estão em uso. Nada é usado para propaganda nem passado a terceiros.
privacidade.quem-ve.titulo=Quem vê
privacidade.quem-ve.texto=O administrador vê e altera todos os cadastros. O operador da portaria vê só o necessário para liberar ou bloquear: a placa, o nome do cliente, as vagas e o contato do cliente quando a entrada é bloqueada.
privacidade.quanto-tempo.titulo=Por quanto tempo
privacidade.quanto-tempo.texto=Enquanto o contrato existir. O histórico de acessos é guardado por 12 meses. Um cliente que encerrar o contrato pode pedir a remoção dos dados pessoais, ressalvado o que a lei obrigar a manter.
privacidade.direitos.titulo=Seus direitos
privacidade.direitos.texto=Qualquer cliente pode pedir para ver, corrigir ou apagar os próprios dados. O pedido é feito à administração do estacionamento, que é a responsável por esses dados.
