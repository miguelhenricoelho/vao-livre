<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{global/global :: cabeca(#{acesso.entrar.titulo}, ~{::link}, ~{})}">
  <link rel="stylesheet" href="/acesso/acesso.css">
</head>
<body class="acesso">
  <main class="acesso__painel" id="conteudo">
    <p class="marca acesso__marca">
      <svg th:replace="~{global/global :: simbolo}"></svg>
      <span>Vão Livre</span>
    </p>

    <p class="acesso__passo numero" th:text="#{acesso.passo(1)}">Passo 1 de 2</p>
    <h1 class="acesso__titulo" th:text="#{acesso.entrar.titulo}">Área da equipe</h1>
    <p class="acesso__apoio" th:text="#{acesso.entrar.apoio}">Texto</p>

    <p class="aviso" role="status" th:if="${param.saiu}" th:text="#{acesso.saiu}">Você saiu.</p>
    <p class="aviso aviso--erro" role="alert" th:if="${erroDaArea == 'SENHA_ERRADA'}" th:text="#{acesso.area.errada}">Senha errada.</p>
    <p class="aviso aviso--erro" role="alert" th:if="${erroDaArea == 'BLOQUEADA'}" th:text="#{acesso.area.bloqueada(${minutos})}">Bloqueada.</p>

    <form class="formulario" th:action="@{/entrar}" method="post">
      <div class="campo">
        <label class="campo__rotulo" for="senhaDaArea" th:text="#{acesso.area.rotulo}">Senha da área</label>
        <input class="entrada" id="senhaDaArea" name="senhaDaArea" type="password" autocomplete="off" required
               th:attr="aria-invalid=${erroDaArea != null ? 'true' : null}">
      </div>
      <button class="botao acesso__botao" type="submit" th:text="#{acesso.continuar}">Continuar</button>
    </form>
    <p class="acesso__nota" th:text="#{acesso.area.nota(${tentativas}, ${minutos})}">Nota</p>
  </main>
  <div class="acesso__pauta" aria-hidden="true">
    <p class="acesso__lema" th:text="#{acesso.lema}">Só entra quem tem vaga.</p>
  </div>
</body>
</html>
