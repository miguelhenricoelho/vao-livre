<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!-- Fragmentos comuns: cabeça, topo, avisos, paginação e rodapé. -->

<head th:fragment="cabeca(titulo, links, scripts)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f3f1ec">
  <title th:text="|${titulo} · Vão Livre|">Vão Livre</title>
  <link rel="icon" href="/global/simbolo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;112,700&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/global/global.css">
  <th:block th:replace="${links}"></th:block>
  <script src="/global/global.js"></script>
  <th:block th:replace="${scripts}"></th:block>
</head>

<body>

<svg th:fragment="simbolo" class="marca__simbolo" viewBox="0 0 24 24" aria-hidden="true">
  <path d="M3 21V5h18v16"/>
  <path class="marca__vao" d="M8 21h8"/>
</svg>

<th:block th:fragment="topo">
  <a class="pular" href="#conteudo" th:text="#{global.pular}">Pular para o conteúdo</a>
  <header class="topo">
    <div class="topo__faixa">
      <a class="marca" th:href="@{/}" th:attr="aria-label=#{global.marca.rotulo}">
        <svg th:replace="~{global/global :: simbolo}"></svg>
        <span>Vão Livre</span>
      </a>

      <nav class="navegacao" th:attr="aria-label=#{global.navegacao}">
        <ul class="navegacao__lista">
          <li th:each="item : ${eu.admin ? {'painel','portaria','clientes','veiculos','historico','equipe','auditoria','ajuda'} : {'portaria','historico','ajuda'}}">
            <a class="navegacao__link" th:href="@{'/' + ${item}}"
               th:text="#{'global.nav.' + ${item}}"
               th:attr="aria-current=${secao == item ? 'page' : null}">Seção</a>
          </li>
        </ul>
      </nav>

      <div class="topo__pessoa">
        <a class="topo__nome" th:href="@{/conta}">
          <span th:text="${eu.nome}">Nome</span>
          <span class="topo__papel" th:text="${eu.papel.descricao}">Papel</span>
        </a>
        <form th:action="@{/sair}" method="post">
          <button class="botao botao--contorno" type="submit" th:text="#{global.sair}">Sair</button>
        </form>
      </div>

      <a class="botao botao--contorno topo__menu" href="#menu" data-abrir-menu th:text="#{global.menu}">Menu</a>
    </div>
  </header>
</th:block>

<th:block th:fragment="avisos">
  <p class="aviso" role="status" th:if="${aviso}" th:text="${aviso}">Aviso</p>
  <p class="aviso aviso--erro" role="alert" th:if="${erro}" th:text="${erro}">Erro</p>
</th:block>

<nav th:fragment="paginacao(pagina)" class="paginacao" th:if="${pagina.totalPages > 1}" th:attr="aria-label=#{global.paginacao}">
  <a th:if="${pagina.hasPrevious()}" class="botao botao--contorno"
     th:href="${@paginacao.link(pagina.number - 1)}" th:text="#{global.anterior}">Anterior</a>
  <span th:if="${!pagina.hasPrevious()}"></span>
  <span class="numero" th:text="#{global.pagina-de(${pagina.number + 1}, ${pagina.totalPages})}">1 de 2</span>
  <a th:if="${pagina.hasNext()}" class="botao botao--contorno"
     th:href="${@paginacao.link(pagina.number + 1)}" th:text="#{global.proxima}">Próxima</a>
  <span th:if="${!pagina.hasNext()}"></span>
</nav>

<th:block th:fragment="rodape">
  <footer class="rodape">
    <div class="rodape__faixa">
      <p><span th:text="#{global.rodape.marca}">Vão Livre</span> · <span class="numero" th:text="${hoje}">25/11/2026</span></p>
      <p class="rodape__links">
        <a th:href="@{/ajuda}" th:text="#{global.nav.ajuda}">Ajuda</a>
        <a th:href="@{/privacidade}" th:text="#{global.privacidade}">Privacidade</a>
        <a th:href="@{/conta}" th:text="#{global.conta}">Minha conta</a>
      </p>
    </div>
  </footer>

  <nav class="menu-celular" id="menu" th:attr="aria-label=#{global.menu}">
    <div class="menu-celular__cabecalho">
      <p class="menu-celular__titulo" th:text="#{global.menu}">Menu</p>
      <button class="botao botao--contorno menu-celular__fechar" type="button" data-fechar-menu th:text="#{global.fechar}">Fechar</button>
    </div>
    <ul class="menu-celular__lista">
      <li th:each="item : ${eu.admin ? {'painel','portaria','clientes','veiculos','historico','equipe','auditoria','ajuda'} : {'portaria','historico','ajuda'}}">
        <a class="menu-celular__link" th:href="@{'/' + ${item}}"
           th:text="#{'global.nav.' + ${item}}"
           th:attr="aria-current=${secao == item ? 'page' : null}">Seção</a>
      </li>
      <li><a class="menu-celular__link" th:href="@{/conta}" th:text="#{global.conta}">Minha conta</a></li>
    </ul>
    <div class="menu-celular__pessoa">
      <p><span th:text="${eu.nome}">Nome</span> · <span class="apoio" th:text="${eu.papel.descricao}">Papel</span></p>
      <form th:action="@{/sair}" method="post">
        <button class="botao" type="submit" th:text="#{global.sair}">Sair</button>
      </form>
    </div>
  </nav>
</th:block>

</body>
</html>
